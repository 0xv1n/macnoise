version: 1
on_error: continue
name: Full Telemetry Sweep
description: Runs every non-root native operation and composed telemetry recipe

steps:
  - category: network

  - id: http_beacon
    include: recipes/http_beacon.yaml

  - id: http_exfil
    include: recipes/http_exfil.yaml

  - category: process

  - id: discovery
    include: discovery.yaml

  # File primitives are ordered so discovery, reads, copies, modification,
  # and archiving consume artifacts created by earlier steps.
  - id: file_create
    module: file_create

  - id: file_modify
    module: file_modify
    params:
      target_path:
        output: file_create.path

  - id: file_find
    module: file_find
    params:
      roots:
        output: file_create.directories

  - id: file_read
    module: file_read
    params:
      paths:
        output: file_find.paths

  - id: file_copy
    module: file_copy
    params:
      source_paths:
        output: file_read.paths

  - id: file_archive
    module: file_archive
    params:
      source_path:
        output: file_copy.directory

  - id: browser_decoy
    module: file_create
    params:
      base_dir: /tmp/macnoise_full_sweep/browser
      filename: Login Data
      content: browser credential decoy

  - id: browser_targets
    include: recipes/browser_targets.yaml
    inputs:
      roots:
        output: browser_decoy.directories

  - module: file_read
    params:
      paths:
        output: browser_targets.paths

  - id: credential_decoy
    module: file_create
    params:
      base_dir: /tmp/macnoise_full_sweep/credential
      filename: .env
      content: credential file decoy

  - id: credential_targets
    include: recipes/credential_targets.yaml
    inputs:
      roots:
        output: credential_decoy.directories

  - module: file_read
    params:
      paths:
        output: credential_targets.paths

  - id: keychain_decoy
    module: file_create
    params:
      base_dir: /tmp/macnoise_full_sweep/keychain
      filename: login.keychain-db
      content: keychain database decoy

  - id: keychain_targets
    include: recipes/keychain_targets.yaml
    inputs:
      roots:
        output: keychain_decoy.directories

  - module: file_copy
    params:
      source_paths:
        output: keychain_targets.paths
      destination_dir: /tmp/macnoise_full_sweep/keychain_stage

  - module: file_encrypt

  - module: file_hide

  # service category is not run wholesale: svc_launch_daemon requires root
  # and this scenario is scoped to run without elevated privileges.
  - module: svc_enumerate

  - module: svc_cron

  - module: svc_launch_agent

  - module: svc_shell_profile

  - module: svc_login_item

  - id: mounted_execution
    include: mounted_execution.yaml

  - category: tcc

  - category: credential

  - category: plist

  - category: evasion
