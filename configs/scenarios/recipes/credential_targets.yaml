version: 1
name: Credential File Target Discovery Recipe
description: Finds a bounded set of well-known credential file names beneath explicit roots
on_error: stop

inputs:
  roots:
    type: path_list
    default:
      - /tmp/macnoise_test

steps:
  - id: targets
    module: file_find
    params:
      roots:
        input: roots
      names:
        - id_rsa
        - id_ed25519
        - id_ecdsa
        - id_dsa
        - credentials
        - config.json
        - .env
        - .netrc
        - .git-credentials
        - .npmrc
      max_depth: 5
      max_results: 100

outputs:
  paths:
    output: targets.paths
