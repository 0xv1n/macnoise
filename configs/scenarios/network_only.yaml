version: 1
on_error: continue
name: Network Telemetry Sweep
description: Composes TCP, listener, DNS, HTTP beacon, and HTTP exfiltration operations

steps:
  - module: net_connect
    params:
      target: "127.0.0.1"
      port: "8080"

  - module: net_listen
    params:
      port: "9999"

  - module: net_dns
    params:
      domains:
        - example.com
        - google.com
        - github.com

  - id: http_beacon
    include: recipes/http_beacon.yaml

  - id: http_exfil
    include: recipes/http_exfil.yaml
