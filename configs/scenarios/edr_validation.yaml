version: 1
on_error: continue
name: EDR Validation Suite
description: Modules most relevant to EDR detection validation, covering process, network, file, persistence, and privacy telemetry

steps:
  - module: proc_exec
    params:
      executable: /bin/sh
      args:
        - -c
        - "echo 'Telemetry Payload Executed' && id"

  - module: proc_inject
    params:
      dylib_path: "/tmp/macnoise_inject.dylib"
      target: "/usr/bin/true"

  - module: proc_signal
    params:
      target_command: "sleep 5"

  - module: net_connect
    params:
      target: "127.0.0.1"
      port: "4444"

  - id: http_beacon
    include: recipes/http_beacon.yaml

  - module: net_dns
    params:
      domains: "example.com,pastebin.com,raw.githubusercontent.com"

  - id: files
    module: file_create
    params:
      base_dir: "/tmp/macnoise_edr"
      count: "5"
      prefix: "edr_test_"

  - id: modify
    module: file_modify
    params:
      target_path:
        output: files.path
      content: edr validation update

  - module: file_read
    params:
      paths:
        output: files.paths

  - module: svc_launch_agent
    params:
      label: "com.macnoise.edrtest"
      program: "/usr/bin/true"

  - module: tcc_fda

  - module: tcc_contacts
